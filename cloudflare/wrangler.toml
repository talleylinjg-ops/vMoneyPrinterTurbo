"$schema" = "node_modules/wrangler/config-schema.json"
name = "moneyprinterturbo"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# HTML/CSS/JS/图片全部走边缘 Assets，源站休眠时前台仍可浏览。
# 仅 /api/* /docs* /health 回源（生成、预览、下载）。
[assets]
directory = "../static"
binding = "ASSETS"
run_worker_first = true

[vars]
BACKEND_ORIGIN = "https://8501-fe5e3452b4fb7c4e.monkeycode-ai.online"

[observability]
enabled = true
