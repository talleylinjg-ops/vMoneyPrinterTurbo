"$schema" = "node_modules/wrangler/config-schema.json"
name = "moneyprinterturbo"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# 静态资源直出 Assets，不计入 Worker 额度。仅 API 走 Worker。
[assets]
directory = "../static"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/health", "/docs/saas", "/openapi.json"]

[[r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "moneyprinterturbo-static"

[vars]
BACKEND_ORIGIN = "https://8501-fe5e3452b4fb7c4e.monkeycode-ai.online"

[observability]
enabled = true
