"$schema" = "node_modules/wrangler/config-schema.json"
name = "moneyprinterturbo"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# 纯静态：Cache → R2 → Assets。文案、成片、配音都在浏览器完成，无回源。
[assets]
directory = "../static"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "moneyprinterturbo-static"

[observability]
enabled = true
