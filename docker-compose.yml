services:
  moneyprinterturbo:
    build: .
    container_name: moneyprinterturbo
    ports:
      - "8501:8501"
    environment:
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
